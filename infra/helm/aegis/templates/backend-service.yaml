apiVersion: v1
kind: Service
metadata:
  name: {{ include "aegis.backend.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aegis.componentLabels" (dict "context" . "component" "backend") | nindent 4 }}
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "aegis.componentSelectorLabels" (dict "context" . "component" "backend") | nindent 4 }}
