<title>AegisSOC Risk Queue</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root{
    color-scheme: dark;
    --bg:#0A0E14; --panel:#121821; --panel-2:#0E141C; --border:#1E2733;
    --ink:#E6ECF2; --muted:#8A98A8; --faint:#5A6675;
    --accent:#00F0FF; --accent2:#0051FF;
    --p1:#FF4D5E; --p2:#FFA733; --p3:#4D9EFF; --p4:#6B7A8D;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);
    line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:0 40px}
  a{color:var(--accent)}
  h1,h2{text-wrap:balance;margin:0}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

  /* header */
  header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;
    background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border)}
  .bar{max-width:1120px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px}
  .brand svg{width:30px;height:30px;flex:none}
  .brand b{font-weight:600;font-size:17px;letter-spacing:.2px}
  .brand b span{background:linear-gradient(120deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .tag{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted);
    border:1px solid var(--border);border-radius:999px;padding:4px 10px}

  .lead{padding:26px 0 6px}
  .lead h1{font-size:24px;font-weight:600}
  .lead p{color:var(--muted);margin:6px 0 0;max-width:70ch}

  /* KPI tiles */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:20px 0 6px}
  .kpi{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px 18px}
  .kpi .n{font-family:var(--mono);font-size:26px;font-weight:600;letter-spacing:-.5px}
  .kpi .n .u{font-size:15px;color:var(--muted);font-weight:400}
  .kpi .l{color:var(--muted);font-size:12.5px;margin-top:4px}
  .kpi.hl{border-color:color-mix(in srgb,var(--accent) 45%,var(--border))}
  .kpi.hl .n{color:var(--accent)}

  /* tabs */
  .tabs{display:flex;gap:6px;margin:26px 0 14px;border-bottom:1px solid var(--border)}
  .tab{appearance:none;background:none;border:0;color:var(--muted);font-family:var(--sans);
    font-size:14px;font-weight:500;padding:9px 14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
  .tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
  .ctx{color:var(--muted);font-size:13px;margin:0 0 14px}
  .ctx b{color:var(--ink);font-weight:600}

  /* queue */
  .queue{display:flex;flex-direction:column;gap:8px}
  .row{background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:hidden}
  .row.p1{box-shadow:inset 3px 0 0 var(--p1)} .row.p2{box-shadow:inset 3px 0 0 var(--p2)}
  .row.p3{box-shadow:inset 3px 0 0 var(--p3)} .row.p4{box-shadow:inset 3px 0 0 var(--p4)}
  .head{display:grid;grid-template-columns:34px 46px 1fr auto;gap:14px;align-items:center;
    width:100%;text-align:left;background:none;border:0;color:inherit;font-family:var(--sans);
    padding:14px 16px;cursor:pointer}
  .head:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .rank{font-family:var(--mono);color:var(--faint);font-size:15px}
  .pill{font-family:var(--mono);font-size:12px;font-weight:600;text-align:center;
    padding:3px 0;border-radius:6px;border:1px solid}
  .pill.p1{color:var(--p1);border-color:color-mix(in srgb,var(--p1) 50%,transparent);background:color-mix(in srgb,var(--p1) 12%,transparent)}
  .pill.p2{color:var(--p2);border-color:color-mix(in srgb,var(--p2) 50%,transparent);background:color-mix(in srgb,var(--p2) 12%,transparent)}
  .pill.p3{color:var(--p3);border-color:color-mix(in srgb,var(--p3) 50%,transparent);background:color-mix(in srgb,var(--p3) 12%,transparent)}
  .pill.p4{color:var(--p4);border-color:color-mix(in srgb,var(--p4) 50%,transparent);background:color-mix(in srgb,var(--p4) 12%,transparent)}
  .who .t{font-weight:600;font-size:15px}
  .who .a{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-top:2px}
  .who .a b{color:var(--accent);font-weight:500}
  .score{display:flex;align-items:center;gap:10px;min-width:150px}
  .track{width:96px;height:8px;border-radius:999px;background:var(--panel-2);overflow:hidden;border:1px solid var(--border)}
  .fill{height:100%;border-radius:999px}
  .fill.p1{background:var(--p1)} .fill.p2{background:var(--p2)} .fill.p3{background:var(--p3)} .fill.p4{background:var(--p4)}
  .sc{font-family:var(--mono);font-size:16px;font-weight:600;width:42px;text-align:right}
  .caret{color:var(--faint);transition:transform .15s}
  .row.open .caret{transform:rotate(90deg)}

  .detail{border-top:1px solid var(--border);padding:14px 16px 18px;display:grid;gap:16px}
  .narr{border-left:2px solid var(--accent);padding:8px 0 8px 12px;color:var(--ink);font-size:14px}
  .facs{display:grid;gap:8px}
  .facs h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:0 0 2px}
  .fac{display:grid;grid-template-columns:150px 1fr 40px;gap:12px;align-items:center;font-size:13px}
  .fac .fn{color:var(--muted)}
  .fac .ftrack{height:6px;background:var(--panel-2);border-radius:999px;overflow:hidden}
  .fac .ffill{height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:999px}
  .fac .fp{font-family:var(--mono);text-align:right;color:var(--ink)}
  .fac .reason{grid-column:1/-1;color:var(--faint);font-size:12px;margin-top:-4px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-family:var(--mono);font-size:11.5px;color:var(--muted);border:1px solid var(--border);
    border-radius:6px;padding:2px 8px;background:var(--panel-2)}
  .grade{font-family:var(--mono);font-size:12px;color:var(--muted)}
  .grade b{color:var(--ink)}
  .reg{font-family:var(--mono);font-size:10.5px;font-weight:600;margin-left:8px;padding:1px 7px;border-radius:5px;
    color:var(--p3);border:1px solid color-mix(in srgb,var(--p3) 45%,transparent);background:color-mix(in srgb,var(--p3) 14%,transparent)}
  .reg.breach{color:var(--p1);border-color:color-mix(in srgb,var(--p1) 45%,transparent);background:color-mix(in srgb,var(--p1) 14%,transparent)}
  .comp{border:1px solid color-mix(in srgb,var(--p2) 35%,var(--border));border-radius:10px;padding:12px 14px;
    background:color-mix(in srgb,var(--p2) 6%,transparent)}
  .comp h3{margin:0 0 4px;font-size:12.5px;letter-spacing:0;text-transform:none;color:var(--ink)}
  .comp-sum{color:var(--muted);font-size:12.5px;margin-bottom:10px}
  .ob{border-top:1px solid var(--border);padding:9px 0 3px}
  .ob:first-of-type{border-top:0;padding-top:0}
  .ob-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px}
  .ob-duty{font-size:12.5px;margin-top:3px;color:var(--ink)}
  .ob-meta{font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:3px}
  .clk{font-family:var(--mono);font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap;border:1px solid}
  .clk.green{color:#22C55E;border-color:color-mix(in srgb,#22C55E 45%,transparent);background:color-mix(in srgb,#22C55E 12%,transparent)}
  .clk.amber{color:var(--p2);border-color:color-mix(in srgb,var(--p2) 45%,transparent);background:color-mix(in srgb,var(--p2) 12%,transparent)}
  .clk.red,.clk.overdue{color:var(--p1);border-color:color-mix(in srgb,var(--p1) 45%,transparent);background:color-mix(in srgb,var(--p1) 14%,transparent)}

  footer{color:var(--faint);font-size:12px;margin-top:26px;padding-top:16px;border-top:1px solid var(--border);line-height:1.7}
  @media (max-width:560px){
    .head{grid-template-columns:28px 42px 1fr;gap:10px}
    .score{grid-column:2/-1;min-width:0;margin-top:2px}
    .fac{grid-template-columns:120px 1fr 36px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header>
  <div class="bar">
    <div class="brand">
      <svg viewBox="0 0 100 100" fill="none" aria-hidden="true">
        <defs><linearGradient id="g" x1="10%" y1="0%" x2="90%" y2="100%">
          <stop offset="0%" stop-color="#00F0FF"/><stop offset="100%" stop-color="#0051FF"/>
        </linearGradient></defs>
        <path d="M50 5L86 19V52C86 74 50 94 50 94C50 94 14 74 14 52V19L50 5Z"
          fill="none" stroke="url(#g)" stroke-width="5"/>
        <path d="M50 30 L64 66 H56 L53 57 H47 L44 66 H36 Z M49 50 H51 L50 45 Z"
          fill="url(#g)"/>
      </svg>
      <b>Aegis<span>SOC</span> AI</b>
    </div>
    <div class="tag">Risk Queue · E1</div>
  </div>
</header>

<div class="wrap">
  <div class="lead">
    <h1>Risk-based incident triage</h1>
    <p>A prioritised queue of correlated incidents, scored by impact. Every rank is a
       transparent weighted sum you can open and read — no model, no black box. Ordering
       is benchmarked against real Microsoft SOC analysts.</p>
  </div>

  <div class="kpis" id="kpis"></div>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-curated" aria-selected="true" onclick="pick('curated')">Curated scenario</button>
    <button class="tab" role="tab" id="tab-guide" aria-selected="false" onclick="pick('guide')">Real GUIDE data</button>
  </div>
  <p class="ctx" id="ctx"></p>
  <div class="queue" id="queue"></div>

  <footer id="foot"></footer>
</div>

<script>
const DATA = __DATA__;
const bandClass = b => b.toLowerCase();
const esc = s => String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const WMAX = 43.2; // largest single-factor weight, for factor-bar scaling

function kpis(){
  const g = DATA.guide || {};
  const tiles = [
    {n:(g.reduction??DATA.curated.reduction), u:'×', l:'Alert→incident reduction (real GUIDE data)', hl:true},
    {n:(g.ndcg_vs_analyst??'—'), u:'', l:'NDCG vs analyst queue order · held-out', hl:true},
    {n:g.incidents?`${(g.alerts/1000|0)}k→${(g.incidents/1000).toFixed(1)}k`:'—', u:'', l:'Alerts triaged → incidents'},
    {n:'0', u:'', l:'LLM calls in the scoring path · fully explainable'},
  ];
  document.getElementById('kpis').innerHTML = tiles.map(t=>
    `<div class="kpi${t.hl?' hl':''}"><div class="n">${t.n}<span class="u">${t.u}</span></div>
     <div class="l">${t.l}</div></div>`).join('');
}

function ctxLine(which){
  if(which==='curated'){
    const c=DATA.curated;
    return `<b>${c.alerts} alerts</b> from ${c.sources.length} sources
      (${c.sources.join(', ')}) correlated into <b>${c.incidents} incidents</b>
      — ${c.reduction}× fewer things to look at. Hand-tuned weights.`;
  }
  const g=DATA.guide;
  if(!g||g.unavailable) return 'GUIDE dataset not loaded in this build.';
  return `<b>${g.incidents.toLocaleString()} real incidents</b> from
    ${g.alerts.toLocaleString()} Microsoft SOC alerts. Weights calibrated to analyst
    QueueRank; ordering measured on <b>${g.held_out_incidents.toLocaleString()} held-out incidents</b>
    (NDCG ${g.ndcg_vs_analyst}, Spearman ${g.spearman_vs_analyst}).`;
}

function rowHTML(inc, i){
  const b=bandClass(inc.band);
  const facs = inc.factors.filter(f=>f.points>=0.5).sort((a,c)=>c.points-a.points).map(f=>
    `<div class="fac"><span class="fn">${esc(f.name.replace(/_/g,' '))}</span>
       <span class="ftrack"><span class="ffill" style="width:${Math.min(100,f.points/WMAX*100)}%"></span></span>
       <span class="fp">+${f.points}</span>
       <span class="reason">${esc(f.reason)}</span></div>`).join('');
  const chips = inc.tactics.map(t=>`<span class="chip">${esc(t)}</span>`).join('');
  const grade = inc.grade?`<div class="grade">Analyst ground truth: <b>${esc(inc.grade)}</b> · engine never sees this</div>`:'';
  const more = inc.n_assets>1?` <b>+${inc.n_assets-1}</b>`:'';
  const c = inc.compliance;
  const badge = c && c.reportable
    ? `<span class="reg${c.breach?' breach':''}">⚖ ${c.breach?'DPDP breach':'CERT-In'}</span>` : '';
  const comp = (c && c.obligations && c.obligations.length) ? `
    <div class="comp">
      <h3>⚖ Regulatory exposure — ${esc(c.penalty_headline)}</h3>
      <div class="comp-sum">${esc(c.summary)}</div>
      ${c.obligations.map(o=>`<div class="ob">
        <div class="ob-top"><b>${esc(o.framework)}</b>${o.clock
          ? `<span class="clk ${o.clock.status}">${esc(o.clock.label)}: ${fmtClock(o.clock.remaining_h)}</span>`:''}</div>
        <div class="ob-duty">${esc(o.duty)}</div>
        <div class="ob-meta">${esc(o.regulator)} · ${esc(o.jurisdiction)} · ${esc(o.penalty)} · <i>${esc(o.in_force)}</i></div>
      </div>`).join('')}
    </div>` : '';
  return `<div class="row ${b}" id="r${i}">
    <button class="head" aria-expanded="false" onclick="toggle(${i})">
      <span class="rank">${i+1}</span>
      <span class="pill ${b}">${inc.band}</span>
      <span class="who"><div class="t">${esc(inc.furthest_tactic)}${badge}</div>
        <div class="a"><b>${esc(inc.headline_asset)}</b>${more} · ${inc.n_alerts} alert${inc.n_alerts>1?'s':''}</div></span>
      <span class="score"><span class="track"><span class="fill ${b}" style="width:${inc.score}%"></span></span>
        <span class="sc">${inc.score}</span><span class="caret">▸</span></span>
    </button>
    <div class="detail" hidden>
      <div class="narr">${esc(inc.narrative)}</div>
      <div class="facs"><h3>Why this rank — factor breakdown</h3>${facs}</div>
      <div class="chips">${chips}</div>
      ${comp}
      ${grade}
    </div>
  </div>`;
}
function fmtClock(h){ if(h<0) return 'OVERDUE'; const hh=Math.floor(h),mm=Math.round((h-hh)*60); return `${hh}h ${String(mm).padStart(2,'0')}m left`; }

function render(which){
  const list = which==='curated' ? DATA.curated.queue
             : (DATA.guide && DATA.guide.top) ? DATA.guide.top : [];
  document.getElementById('ctx').innerHTML = ctxLine(which);
  document.getElementById('queue').innerHTML = list.map(rowHTML).join('') ||
    '<div class="ctx">No incidents to show.</div>';
}
function toggle(i){
  const r=document.getElementById('r'+i);
  const d=r.querySelector('.detail'), h=r.querySelector('.head');
  const open=d.hidden; d.hidden=!open; r.classList.toggle('open',open);
  h.setAttribute('aria-expanded',open);
}
function pick(which){
  for(const id of ['curated','guide']){
    document.getElementById('tab-'+id).setAttribute('aria-selected', String(id===which));
  }
  render(which);
}

document.getElementById('foot').innerHTML =
  `<b>Method.</b> Alerts are correlated by shared entity + time window, then each incident is
   scored 0–100 by a fixed weighted sum of impact factors (asset criticality, kill-chain stage
   &amp; progression, blast radius, detection confidence, corroboration) → priority band P1–P4.
   Scoring is deterministic; the plain-English summary is generated on top and never changes a score.<br>
   <b>Data.</b> Microsoft GUIDE (CDLA-2.0): 4.1M evidence rows, 9,980 analyst-ranked incidents.
   AegisSOC AI · problem E1.`;

kpis(); pick('curated');
</script>
